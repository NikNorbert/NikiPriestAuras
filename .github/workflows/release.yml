name: Build addon package

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build installable ZIP
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag") {
            ./tools/package.ps1 -Version "${{ github.ref_name }}"
          } else {
            ./tools/package.ps1
          }

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: NikiPriestAuras
          path: dist/*.zip
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $archive = (Get-ChildItem -LiteralPath ./dist -Filter *.zip).FullName
          gh release create "${{ github.ref_name }}" $archive `
            --generate-notes `
            --title "NikiPriestAuras ${{ github.ref_name }}"
